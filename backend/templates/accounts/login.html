{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="{% static 'css/app.css' %}"
    >

</head>
<body>

<div class="auth-layout">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Job App Manager</h1>

            <p>
                Sign in to your account
            </p>

        </div>

        {% if messages %}

            {% for message in messages %}

                <div class="message error">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

        <form method="post" class="app-form">

            {% csrf_token %}

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                >

            </div>

            <button
                type="submit"
                class="btn btn-primary auth-submit"
            >
                Login
            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="{% url 'signup' %}">
                Create one
            </a>

        </div>

    </div>

</div>

</body>
</html>
