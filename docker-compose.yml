services:

  postgres:
    image: postgres:17
    container_name: communication-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: communication_platform
      POSTGRES_USER: communication_platform
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: communication-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
